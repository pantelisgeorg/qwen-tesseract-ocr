[project]
name = "qwen-ocr"
version = "0.1.0"
description = "Qwen2.5-VL OCR example"
requires-python = ">=3.10,<3.13"

dependencies = [
    "requests",
    "huggingface-hub",
    "accelerate>=0.26.0",
    "pillow",
    "ipykernel",
    "jupyter",
    "ipywidgets",
    "qwen-vl-utils",
    "torch",
    "torchvision",
    "torchaudio",
    "transformers",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }
transformers = { git = "https://github.com/huggingface/transformers" }
